name: Fix legacy Slack Lead duplicate rows

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix_slack_lead_legacy_duplicate_rows.py'
      - '.github/workflows/fix-slack-lead-legacy-duplicate-rows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile legacy duplicate Lead rows
        run: python .github/scripts/fix_slack_lead_legacy_duplicate_rows.py

      - name: Commit duplicate reconciliation
        run: |
          set -euo pipefail
          git config user.name 'A2O Automation'
          git config user.email 'a2ogrouphk@gmail.com'
          git add app/api/_lib/slackLeadList.ts
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: reconcile legacy Slack Lead duplicate rows'
          git push origin HEAD:main
