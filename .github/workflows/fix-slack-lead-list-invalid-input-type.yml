name: Fix Slack Lead List invalid input type

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/fix_slack_lead_list_invalid_input_type.py'
      - '.github/workflows/fix-slack-lead-list-invalid-input-type.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove invalid legacy email-column payload
        run: python .github/scripts/fix_slack_lead_list_invalid_input_type.py

      - name: Commit Slack Lead List fix
        run: |
          set -euo pipefail
          git config user.name 'A2O Automation'
          git config user.email 'a2ogrouphk@gmail.com'
          git add app/api/_lib/slackLeadList.ts
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'fix: stop writing WhatsApp URL into Slack email column'
          git push origin HEAD:main
