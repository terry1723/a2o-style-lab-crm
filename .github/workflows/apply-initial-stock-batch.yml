name: Apply initial A2O stock batch

on:
  push:
    paths:
      - '.github/workflows/apply-initial-stock-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Slack stock sync
        run: python .github/scripts/patch_initial_stock_batch.py
      - name: Commit patch
        run: |
          git config user.name "A2O Automation"
          git config user.email "a2ogrouphk@gmail.com"
          git add app/api/slack-sync.ts
          git commit -m "feat: apply confirmed initial A2O stock batch"
          git push origin HEAD:main
