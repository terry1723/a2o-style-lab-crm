name: Apply Slack List failure diagnostics

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/patch_slack_list_failure_diagnostics.py'
      - '.github/workflows/apply-slack-list-failure-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Slack List error diagnostics
        run: python .github/scripts/patch_slack_list_failure_diagnostics.py

      - name: Commit diagnostics
        run: |
          set -euo pipefail
          git config user.name 'A2O Automation'
          git config user.email 'a2ogrouphk@gmail.com'
          git add app/api/_lib/slackLeadList.ts
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'chore: expose Slack List create and update errors'
          git push origin HEAD:main
