name: Apply A2O stock list setup

on:
  push:
    paths:
      - '.github/workflows/apply-stock-list-setup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add A2O stock list setup
        run: python .github/scripts/patch_stock_list_setup.py
      - name: Commit patch
        run: |
          git config user.name "A2O Automation"
          git config user.email "a2ogrouphk@gmail.com"
          git add app/api/slack-sync.ts
          git commit -m "feat: create A2O stock list in Slack"
          git push origin HEAD:main
