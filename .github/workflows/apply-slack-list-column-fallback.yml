name: Apply Slack List column fallback

on:
  push:
    paths:
      - '.github/workflows/apply-slack-list-column-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add positional column fallback
        run: python .github/scripts/patch_slack_list_columns.py
      - name: Commit patch
        run: |
          git config user.name "A2O Automation"
          git config user.email "a2ogrouphk@gmail.com"
          git add app/api/_lib/slackLeadList.ts
          git commit -m "fix: map Slack List columns by template position"
          git push origin HEAD:main
