name: Apply Slack List integration

on:
  push:
    paths:
      - '.github/workflows/apply-slack-list-integration.yml'
      - '.github/scripts/patch_slack_list_integration.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch existing Slack sync endpoint
        run: python .github/scripts/patch_slack_list_integration.py
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "A2O Automation"
          git config user.email "a2ogrouphk@gmail.com"
          git add app/api/slack-sync.ts
          git commit -m "feat: sync A2O leads into existing Slack List"
          git push origin HEAD:main
