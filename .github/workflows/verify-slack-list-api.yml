name: Verify Slack List API

on:
  push:
    paths:
      - '.github/workflows/verify-slack-list-api.yml'
      - 'app/api/slack-list-sync.ts'
      - 'app/api/_lib/slackLeadList.ts'
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck Slack List API
        run: |
          cat > tsconfig.slack-list.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "allowImportingTsExtensions": true,
              "noEmit": true,
              "types": ["node"]
            },
            "include": [
              "api/slack-list-sync.ts",
              "api/_lib/slackLeadList.ts",
              "api/_lib/supabaseAdmin.ts",
              "src/features/ad-leads/adLeadService.ts"
            ]
          }
          JSON
          npx tsc -p tsconfig.slack-list.json
