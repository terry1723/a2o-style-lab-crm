name: A2O Slack sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/slack-sync.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: a2o-slack-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=a2o-slack-sync")"
          TOKEN="$(jq -r '.value' <<<"${RESPONSE}")"
          test -n "${TOKEN}"
          test "${TOKEN}" != "null"
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Trigger A2O Slack sync
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          HTTP_STATUS="$(curl -sS --retry 3 --retry-all-errors --retry-delay 5 --max-time 90 \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -o response.json \
            -w '%{http_code}' \
            https://a2o-style-lab.vercel.app/api/slack-sync)"
          cat response.json
          echo
          echo "HTTP ${HTTP_STATUS}"
          test "${HTTP_STATUS}" -ge 200
          test "${HTTP_STATUS}" -lt 300

