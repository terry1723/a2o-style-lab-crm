name: A2O Slack sync maintenance

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/slack-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace heavy client queries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = "supabase.from('clients').select('*').order('created_at', { ascending: false }),"
          new = "supabase.from('clients').select('id,name,phone,plan,plan_price,amount_paid,balance_due,status'),"
          paths = [Path('app/api/slack-sync.ts'), Path('app/api/slack-bootstrap.ts')]

          for path in paths:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected query not found in {path}')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit query fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/slack-sync.ts app/api/slack-bootstrap.ts
          git commit -m "fix: avoid clients table statement timeout in Slack sync"
          git push
