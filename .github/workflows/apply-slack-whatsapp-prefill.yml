name: Apply Slack WhatsApp prefill

on:
  push:
    branches:
      - fix/slack-whatsapp-prefill
    paths:
      - '.github/workflows/apply-slack-whatsapp-prefill.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/slack-whatsapp-prefill

      - name: Add WhatsApp prefilled link
        run: python .github/scripts/patch_slack_whatsapp_prefill.py

      - name: Verify production build
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name "A2O Automation"
          git config user.email "a2ogrouphk@gmail.com"
          git add app/api/_lib/slackLeadList.ts
          git commit -m "feat: add one-click WhatsApp prefilled replies"
          git push origin HEAD:fix/slack-whatsapp-prefill
