name: Patch client channel sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/client-sync-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix client backfill position
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/api/slack-sync.ts')
          text = path.read_text()

          marker = '    // One-time idempotent backfill of existing Package clients into #a2o-clients.\n'
          bootstrap_lead = '    for (const lead of leads) {\n        initialKeys.push'
          notification_lead = '    for (const lead of leads) {\n      if (sent >= maxEvents) break\n'

          start = text.find(marker)
          if start < 0:
              raise SystemExit('client backfill block not found')
          end = text.find(bootstrap_lead, start)
          if end < 0:
              raise SystemExit('bootstrap lead loop not found after backfill block')

          text = text[:start] + text[end:]

          block = """    // One-time idempotent backfill of existing Package clients into #a2o-clients.
    // Existing Package clients are filled first; once all backfill keys exist this loop sends nothing.
    for (const client of clients) {
      if (sent >= maxEvents) break

      const clientId = String(client.id || '')
      if (!clientId) continue

      const backfillKey = `${CLIENT_BACKFILL_PREFIX}${clientId}`
      if (seenEvents.has(backfillKey)) continue

      const paid = parseNumber(client.amount_paid)
      const planPrice = parseNumber(client.plan_price)
      const relevant = paid > 0 || planPrice > 0 || Boolean(client.plan)

      if (!relevant) {
        await markEvents(supabase, [backfillKey])
        seenEvents.add(backfillKey)
        continue
      }

      await send(channel('clients'), clientBackfillMessage(client), [backfillKey])
    }

"""

          insert_at = text.find(notification_lead)
          if insert_at < 0:
              raise SystemExit('notification lead loop not found')
          text = text[:insert_at] + block + text[insert_at:]
          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "A2O CRM Bot"
          git config user.email "145178744+terry1723@users.noreply.github.com"
          git add app/api/slack-sync.ts
          git commit -m "fix: place Package client backfill in notification loop"
          git push origin main
