name: Cleanup client channel backfill

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/client-sync-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove one-time backfill logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/api/slack-sync.ts')
          text = path.read_text()

          text = text.replace("const CLIENT_BACKFILL_PREFIX = 'slack:client-backfill:v1:'\n", '', 1)

          function_start = text.find('function clientBackfillMessage(client: ClientRow): string {\n')
          function_end = text.find('function clientUpdateMessage(client: ClientRow): string {\n', function_start)
          if function_start >= 0 and function_end >= 0:
              text = text[:function_start] + text[function_end:]

          loop_marker = '    // One-time idempotent backfill of existing Package clients into #a2o-clients.\n'
          normal_lead_loop = '    for (const lead of leads) {\n      if (sent >= maxEvents) break\n'
          loop_start = text.find(loop_marker)
          if loop_start >= 0:
              loop_end = text.find(normal_lead_loop, loop_start)
              if loop_end < 0:
                  raise SystemExit('normal lead notification loop not found')
              text = text[:loop_start] + text[loop_end:]

          path.write_text(text)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "A2O CRM Bot"
          git config user.email "145178744+terry1723@users.noreply.github.com"
          git add app/api/slack-sync.ts
          git commit -m "chore: remove completed Package client backfill"
          git push origin main
