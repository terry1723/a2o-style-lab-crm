name: Patch client channel sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/client-sync-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prioritize one-time client backfill
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/api/slack-sync.ts')
          text = path.read_text()

          marker = '    // One-time idempotent backfill of existing Package clients into #a2o-clients.\n'
          response_marker = '    response.status(errors.length ? 207 : 200).json({\n'
          lead_marker = '    for (const lead of leads) {\n'

          start = text.find(marker)
          if start < 0:
              raise SystemExit('client backfill block not found')
          end = text.find(response_marker, start)
          if end < 0:
              raise SystemExit('client backfill block end not found')

          block = text[start:end]
          text = text[:start] + text[end:]

          lead_index = text.find(lead_marker)
          if lead_index < 0:
              raise SystemExit('lead loop not found')

          text = text[:lead_index] + block + text[lead_index:]
          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "A2O CRM Bot"
          git config user.email "145178744+terry1723@users.noreply.github.com"
          git add app/api/slack-sync.ts
          git commit -m "fix: prioritize one-time Package client backfill"
          git push origin main
