name: Apply lead follow-up message

on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/patch_lead_followup_message.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch follow-up template
        run: python .github/scripts/patch_lead_followup_message.py

      - name: Commit updated template
        run: |
          set -euo pipefail
          git config user.name 'A2O Automation'
          git config user.email 'a2ogrouphk@gmail.com'
          git add app/api/_lib/slackLeadList.ts
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'feat: update new lead follow-up message'
          git push origin HEAD:main
