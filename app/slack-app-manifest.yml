display_information:
  name: A2O CRM Bot
  description: A2O lead, client and follow-up notifications
  background_color: "#1B1916"
features:
  bot_user:
    display_name: A2O CRM Bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - files:read
      - lists:read
      - lists:write
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
